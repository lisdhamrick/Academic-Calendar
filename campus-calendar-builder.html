<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Calendar Builder</title>
    <link rel="stylesheet" href="./campus-calendar.css" />
    <style>
      .builder-page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1.25rem;
      }
      .builder-card {
        background: #fff;
        border: 1px solid #d7dfe8;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .builder-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 0.85rem;
      }
      .builder-field {
        display: grid;
        gap: 0.35rem;
      }
      .builder-field label {
        font-weight: 700;
        color: #173955;
      }
      .builder-field input,
      .builder-field textarea,
      .builder-field select {
        font: inherit;
        padding: 0.55rem 0.65rem;
        border: 1px solid #cdd7e1;
      }
      .builder-field textarea {
        min-height: 8rem;
        resize: vertical;
      }
      .builder-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-top: 1rem;
      }
      .builder-btn {
        font: inherit;
        padding: 0.7rem 1rem;
        border: 1px solid #cdd7e1;
        background: #fff;
        cursor: pointer;
      }
      .builder-btn-primary {
        background: #005987;
        border-color: #005987;
        color: #fff;
      }
      .builder-output {
        display: grid;
        gap: 0.85rem;
      }
      .builder-output textarea {
        min-height: 7rem;
      }
      .builder-preview {
        width: 100%;
        min-height: 900px;
        border: 1px solid #d7dfe8;
        background: #fff;
      }
      .builder-help {
        margin: 0;
        color: #35546f;
      }
    </style>
  </head>
  <body>
    <main class="builder-page">
      <section class="builder-card">
        <h1>Campus Calendar Builder</h1>
        <p class="builder-help">
          Paste a Google Calendar embed URL, choose your campus colors, and generate a branded custom calendar URL and iframe snippet. Use a browser-restricted Google API key with Google Calendar API enabled.
        </p>
      </section>

      <section class="builder-card">
        <div class="builder-grid">
          <div class="builder-field">
            <label for="builderTitle">Calendar Title</label>
            <input id="builderTitle" type="text" value="Campus Calendar" />
          </div>
          <div class="builder-field">
            <label for="builderPrimary">Primary Color</label>
            <input id="builderPrimary" type="color" value="#005987" />
          </div>
          <div class="builder-field">
            <label for="builderAccent">Accent Color</label>
            <input id="builderAccent" type="color" value="#ffc000" />
          </div>
          <div class="builder-field">
            <label for="builderDaysAhead">Days Ahead</label>
            <input id="builderDaysAhead" type="number" min="7" max="365" value="120" />
          </div>
          <div class="builder-field" style="grid-column: 1 / -1;">
            <label for="builderApiKey">Google API Key</label>
            <input id="builderApiKey" type="text" placeholder="AIza..." />
          </div>
          <div class="builder-field" style="grid-column: 1 / -1;">
            <label for="builderEmbedUrl">Google Embed URL or iframe HTML</label>
            <textarea id="builderEmbedUrl" placeholder="Paste the Google Calendar embed URL or full iframe HTML here"></textarea>
          </div>
        </div>

        <div class="builder-actions">
          <button class="builder-btn builder-btn-primary" id="builderGenerate" type="button">Generate</button>
          <button class="builder-btn" id="builderCopyUrl" type="button">Copy URL</button>
          <button class="builder-btn" id="builderCopyIframe" type="button">Copy iframe</button>
        </div>
      </section>

      <section class="builder-card builder-output">
        <div class="builder-field">
          <label for="builderUrl">Shareable URL</label>
          <textarea id="builderUrl" readonly></textarea>
        </div>
        <div class="builder-field">
          <label for="builderIframe">Embed Snippet</label>
          <textarea id="builderIframe" readonly></textarea>
        </div>
      </section>

      <section class="builder-card">
        <iframe class="builder-preview" id="builderPreview" title="Campus calendar preview"></iframe>
      </section>
    </main>

    <script src="./campus-calendar-builder.js"></script>
  </body>
</html>
